phase: g1
env:
  task: hover
  ctrl_freq: 30
  pyb_freq: 240
  episode_sec: 10
  speed_limit: 1.0              # m/s (đo ở G0: VEL+DSLPID bám 0.98 m/s ổn định, nghiêng tối đa 0.55 rad)
  obs_scales: {pos: 2.0, vel: 2.0, rpy: 1.0, ang_v: 5.0}
  hover:
    goal: [0, 0, 1]
    start_box: {x: [-0.8, 0.8], y: [-0.8, 0.8], z: [0.3, 1.7]}
    bound_xy: 2.0
    bound_z: 2.5
    max_tilt: 0.8
    settle_sec: 3.0
    success_err: 0.1
reward: {dist_k: 2.0, vel_pen: 0.05, crash: -10.0}
algo:
  name: ppo
  total_steps: 1500000          # ≈ 2.4 h ở ~2.5k bước/s (ước lượng G0, docs/machine.md)
  n_envs: auto
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  policy_kwargs: {net_arch: {pi: [64, 64], vf: [64, 64]}, log_std_init: -1.0}
  vecnormalize: {obs: true, reward: true}
  checkpoint_every: 250000
train_seeds: [0, 1, 2]
eval: {episodes: 100, seed0: 9000}
gate: {name: G1, metric: mean_pos_err_after_settle, op: "<", value: 0.1, extra: ["crash_count == 0 ở cả 3 seed"]}
