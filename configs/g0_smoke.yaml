phase: g0
env:
  task: smoke                  # bài toán HoverAviary gốc trên giao diện 4.1
  ctrl_freq: 30
  pyb_freq: 240
  episode_sec: 8
  speed_limit: 1.0             # m/s; thư viện mặc định 0.03*30 km/h = 0.25 m/s (đo thật ở G0)
  obs_scales: {pos: 1.0, vel: 1.0, rpy: 1.0, ang_v: 1.0}
  hover:
    goal: [0, 0, 1]
    start_box: {x: [-0.5, 0.5], y: [-0.5, 0.5], z: [0.5, 1.5]}
    bound_xy: 1.5
    bound_z: 2.0
    max_tilt: 0.4
    settle_sec: 3.0
    success_err: 0.1
reward: {crash: 0.0}
algo:
  name: ppo
  total_steps: 20000
  n_envs: auto
  n_steps: 512
  batch_size: 256
  n_epochs: 5
  policy_kwargs: {net_arch: {pi: [64, 64], vf: [64, 64]}, log_std_init: -1.0}
  vecnormalize: {obs: true, reward: true}
  checkpoint_every: 0
train_seeds: [0]
eval: {episodes: 5, seed0: 9000}
gate: {name: G0, metric: n_episodes, op: ">=", value: 5, extra: ["pytest xanh", "train 20000 bước không lỗi", "viewer mở được quỹ đạo"]}
