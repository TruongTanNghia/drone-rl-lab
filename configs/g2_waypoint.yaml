phase: g2
env:
  task: waypoint
  ctrl_freq: 30
  pyb_freq: 240
  episode_sec: 40
  speed_limit: 1.5              # m/s, ghi đè SPEED_LIMIT mặc định 0.25
  obs_scales: {pos: 4.0, vel: 2.0, rpy: 1.0, ang_v: 5.0}
  waypoints: {count: 4, box: {x: [-4, 4], y: [-4, 4], z: [1, 3]}, min_gap: 2.5, reach_radius: 0.35, start: [0, 0, 1.5], bound_xy: 6.0, bound_z: 4.0, max_tilt: 1.2}
  randomization: {wind_max: 2.0, gust_sigma: 0.8, gust_tau: 2.0, mass_scale: [0.8, 1.2], wind_cd: 0.02}   # c_d: 2 m/s gió → trôi 1.1 m / 6 s (docs/calibration.json)
  curriculum:
    - {name: one_wp_calm, overrides: {waypoint_count: 1, wind_max: 0.0, gust_sigma: 0.0, mass_lo: 1.0, mass_hi: 1.0}, promote_at: 0.8, window: 100}
    - {name: full, overrides: {}, promote_at: null}
reward: {progress: 5.0, reach_bonus: 10.0, time_penalty: 0.03, crash: -50.0}
algo:
  name: ppo
  total_steps: 3000000
  n_envs: auto
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  policy_kwargs: {net_arch: {pi: [64, 64], vf: [64, 64]}, log_std_init: -1.0}
  vecnormalize: {obs: true, reward: true}
  checkpoint_every: 100000          # mốc dày để xem lại quá trình huấn luyện
train_seeds: [0, 1, 2]
eval: {episodes: 100, seed0: 9000}
gate: {name: G2, metric: success_rate, op: ">=", value: 0.90, extra: ["ghi thêm seed kém nhất"]}
